name: Send briefing emails

on:
  schedule:
    # Every 15 minutes. Delivery lands within ~15 min of each subscriber's
    # chosen time, not to the exact minute — see scripts/lib/localTime.mjs.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send due emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIFT_FROM_ADDRESS: ${{ secrets.SIFT_FROM_ADDRESS }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run send-emails
