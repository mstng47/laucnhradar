name: Daily pipeline

on:
  schedule:
    # 04:00 UTC = 6am Paris time in summer (CEST, UTC+2). GitHub's cron
    # doesn't adjust for daylight saving, so this drifts to 7am Paris once
    # winter time (CET, UTC+1) starts in late October — nudge this forward
    # to 05:00 UTC then if you want it back to 6am.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npm run pipeline

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-digest
          path: output/latest.json
