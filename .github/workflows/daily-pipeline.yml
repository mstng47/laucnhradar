name: Daily pipeline

on:
  schedule:
    # 07:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: npm run pipeline

      - name: Upload digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: latest-digest
          # One file per profile now (output/latest.finn.json,
          # output/latest.dawood.json, ...) — see scripts/summarize.mjs.
          path: output/latest.*.json
